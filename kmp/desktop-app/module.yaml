product: jvm/app
apply:
  - ../compose.module-template.yaml
dependencies:
  - ../shared-ui
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0
  - $compose.desktop.currentOs
  - org.bytedeco:javacv:1.5.14
  - org.bytedeco:ffmpeg:8.1.2-1.5.14
  # Default LGPL native builds, not the optional -gpl variants. Loaders select architecture-specific resources.
  - org.bytedeco:ffmpeg:8.1.2-1.5.14:windows-x86_64
  - org.bytedeco:ffmpeg:8.1.2-1.5.14:macosx-arm64
  - org.bytedeco:ffmpeg:8.1.2-1.5.14:macosx-x86_64
  - org.bytedeco:ffmpeg:8.1.2-1.5.14:linux-x86_64
  - org.bytedeco:javacpp:1.5.14:windows-x86_64
  - org.bytedeco:javacpp:1.5.14:macosx-arm64
  - org.bytedeco:javacpp:1.5.14:macosx-x86_64
  - org.bytedeco:javacpp:1.5.14:linux-x86_64
test-dependencies:
  - org.jetbrains.compose.ui:ui-test-junit4:1.12.1
  - org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0
settings:
  jvm:
    release: 21
    mainClass: montage.desktop.MainKt
