name: KMP skeleton

on:
  push:
    branches: [rewrite/kmp]
    paths: ['kmp/**', '.github/workflows/kmp.yml']
  pull_request:
    paths: ['kmp/**', '.github/workflows/kmp.yml']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate
        required: true
        default: all
        type: choice
        options: [all, desktop, android, ios]
      ios_ui_runtime:
        description: iOS UI simulator runtime (explicit compatibility option)
        required: true
        default: latest
        type: choice
        options: [latest, '26.4']

permissions:
  contents: read

concurrency:
  group: kmp-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  desktop:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'desktop' }}
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            shell: cmd
            cli: call kotlin.bat
            python: python
            jdk: '25.0.4.1+1'
          - os: macos-26
            shell: bash
            cli: ./kotlin
            python: python3
            jdk: '25.0.5+8'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      SKIKO_RENDER_API: SOFTWARE
    defaults:
      run:
        working-directory: kmp
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toolchain 0.13's HTTP parser rejects current JDK download redirects.
      # Its official auto selection accepts a matching JAVA_HOME instead.
      - name: Set up pinned build JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: Verify toolchain
        run: ${{ matrix.cli }} --version
      - name: Build native-host desktop artifacts
        run: ${{ matrix.cli }} build -m desktop-app
      - name: Test shared logic on JVM
        run: ${{ matrix.cli }} test -m core --platform jvm
      - name: Require executed tests
        run: ${{ matrix.python }} scripts/verify-ci-tests.py --xml-dir build/reports/core/jvm --min-tests 26
      - name: Enable hosted Windows audio services
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($montageService in @('AudioEndpointBuilder', 'Audiosrv')) {
            try {
              Set-Service $montageService -StartupType Manual -ErrorAction Stop
              Start-Service $montageService -ErrorAction Stop
            } catch {
              Write-Output "Hosted sound output unavailable: $montageService"
            }
          }
      - name: Exercise desktop Compose UI
        run: ${{ matrix.cli }} test -m desktop-app --platform jvm
      - name: Require desktop UI test
        run: ${{ matrix.python }} scripts/verify-ci-tests.py --xml-dir build/reports/desktop-app/jvm --min-tests 15
      - name: Upload desktop artifacts and reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            kmp/build/tasks/*_jarJvm/*.jar
            kmp/build/reports/core/jvm/*.xml
            kmp/build/reports/desktop-app/jvm/*.xml
            kmp/build/ui-smoke/desktop/**
          retention-days: 7
          if-no-files-found: warn

  android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android' }}
    name: Android APK and host unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: kmp
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check hosted SDK prerequisite
        run: |
          test -n "${ANDROID_HOME:-}"
          test -s "$ANDROID_HOME/licenses/android-sdk-license"
      - name: Set up pinned build JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - name: Verify toolchain
        run: ./kotlin --version
      - name: Build APK
        run: ./kotlin build -m android-app
      - name: Test shared logic for Android
        run: ./kotlin test -m core --platform android
      - name: Require executed tests
        run: python3 scripts/verify-ci-tests.py --xml-dir build/reports/core/android --min-tests 26
      - name: Free unused hosted toolchains for emulator
        run: |
          # This isolated job has finished building the APK and host tests.
          # Emulator QA uses neither native build toolchains nor .NET.
          test -n "${ANDROID_HOME:-}"
          df -h .
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" /usr/share/dotnet
          df -h .
      - name: Allow hosted emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Exercise Android app UI on emulator
        timeout-minutes: 12
        run: ./scripts/boot-android-smoke.sh
      - name: Upload APK and reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug
          path: |
            kmp/build/tasks/_android-app_buildAndroidDebug/*.apk
            kmp/build/reports/core/android/*.xml
            kmp/build/ui-smoke/android/**
          retention-days: 7
          if-no-files-found: warn

  ios:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    name: iOS Arm64 simulator
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: kmp
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Apple host and SDK
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devices available
      - name: Type-check native iOS fixture source
        run: |
          xcrun swiftc -typecheck -parse-as-library -target arm64-apple-ios15.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -framework UIKit \
            ios-app/ui-tests/fixture-source/FixtureSource.swift
          xcrun swiftc -typecheck -parse-as-library -target arm64-apple-ios15.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -framework UIKit -framework CryptoKit \
            ios-app/ui-tests/fixture-reader/FixtureReader.swift
      - name: Set up pinned build JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - name: Prefetch verified Toolchain Xcode log formatter
        run: |
          # Toolchain 0.13 uses this exact release and sha256(URL + "V1")[:10]
          # cache name. curl accepts GitHub's long redirect headers; Ktor CIO does not.
          export KOTLIN_SHARED_CACHE_DIR="$RUNNER_TEMP/montage-kotlin-cache"
          printf 'KOTLIN_SHARED_CACHE_DIR=%s\n' "$KOTLIN_SHARED_CACHE_DIR" >> "$GITHUB_ENV"
          montage_xcbeautify_url='https://github.com/cpisciotta/xcbeautify/releases/download/3.2.1/xcbeautify-3.2.1-arm64-apple-macosx.zip'
          montage_xcbeautify_key=$(printf '%sV1' "$montage_xcbeautify_url" | shasum -a 256 | cut -c 1-10)
          mkdir -p "$KOTLIN_SHARED_CACHE_DIR/download.cache"
          montage_xcbeautify_archive="$KOTLIN_SHARED_CACHE_DIR/download.cache/$montage_xcbeautify_key-xcbeautify-3.2.1-arm64-apple-macosx.zip"
          curl --fail --location --retry 3 --output "$montage_xcbeautify_archive.part" "$montage_xcbeautify_url"
          printf '%s  %s\n' 'ed32972e41bc3aa19588f8b0f4a0209ef70c663ad60bbf4ad84a2de73355d637' "$montage_xcbeautify_archive.part" | shasum -a 256 --check
          mv "$montage_xcbeautify_archive.part" "$montage_xcbeautify_archive"
      - name: Verify toolchain
        run: ./kotlin --version
      - name: Build simulator application
        run: ./kotlin build -m ios-app --platform iosSimulatorArm64
      - name: Test shared logic on simulator
        run: |
          set -o pipefail
          ./kotlin test -m core --platform iosSimulatorArm64 --format teamcity 2>&1 | tee ios-tests.log
      - name: Require executed native tests
        run: python3 scripts/verify-ci-tests.py --teamcity-log ios-tests.log --min-tests 26
      # Keep the current compiler/SDK and latest installed UI runtime by default.
      # Explicit compatibility requests are recorded in simulator.json.
      - name: Exercise iOS app UI on simulator
        timeout-minutes: 24
        env:
          MONTAGE_IOS_UI_RUNTIME: ${{ inputs.ios_ui_runtime || 'latest' }}
        run: ./scripts/ios-ui-smoke.sh
      - name: Upload iOS test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-evidence
          path: |
            kmp/ios-tests.log
            kmp/build/reports/core/iosSimulatorArm64/**
            kmp/ios-app/module.xcodeproj/**
            kmp/build/ui-smoke/ios/attachments/**
            kmp/build/ui-smoke/ios/xcodebuild.log
            kmp/build/ui-smoke/ios/import-stages.log
            kmp/build/ui-smoke/ios/preview-stages.log
            kmp/build/ui-smoke/ios/file-provider-errors.log
            kmp/build/ui-smoke/ios/storage-result.json
            kmp/build/ui-smoke/ios/simulator.json
            kmp/build/ui-smoke/ios/fixture-source.json
            kmp/build/ui-smoke/ios/native-picker-control.json
            kmp/build/ui-smoke/ios/native-picker-control.log
            kmp/build/ui-smoke/ios/result.json
          retention-days: 7
          if-no-files-found: warn
      - name: Upload complete iOS UI result bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-xcresult
          path: kmp/build/ui-smoke/ios/DraftUiSmoke.xcresult/**
          retention-days: 7
          if-no-files-found: warn
